{{ define "main" }}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="h5 mb-0 fw-semibold"><i class="bi bi-arrow-left-right me-2 text-primary"></i>Transactions</h2>
  <div class="d-flex gap-2">
    <div id="btn-refresh-group" class="btn-group btn-group-sm d-none" role="group" aria-label="Refresh source">
      <button class="btn btn-outline-secondary" onclick="refreshItems('github')">
        <i class="bi bi-github me-1"></i>GitHub
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshItems('gcs')">
        <i class="bi bi-cloud me-1"></i>GCS
      </button>
      <button class="btn btn-outline-primary" onclick="refreshItems('api')">
        <i class="bi bi-plug me-1"></i>API
      </button>
    </div>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="openCreateModal()">
      <i class="bi bi-plus-lg me-1"></i>Log Transaction
    </button>
  </div>
</div>

<div id="loading" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
<div id="empty-state" class="text-center py-5 d-none">
  <i class="bi bi-inbox fs-1 text-muted"></i>
  <p class="text-muted mt-2">No transactions yet.</p>
</div>

<div class="card shadow-sm border-0 d-none" id="items-card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">Product</th>
            <th>Date</th>
            <th>Type</th>
            <th>Qty</th>
            <th>Price</th>
            <th class="text-end pe-3">Actions</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="modal-title">Log Transaction</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="item-id">
        <input type="hidden" id="item-product-id">
        <div class="mb-3">
          <label class="form-label small fw-medium">Product <span class="text-danger">*</span></label>
          <!-- Filterable product picker -->
          <div class="product-picker" id="product-picker">
            <div class="d-flex gap-2 mb-2">
              <select class="form-select form-select-sm" id="picker-filter-type" style="width:auto;">
                <option value="">All Types</option>
                <option value="sealed">Sealed</option>
                <option value="card">Singles</option>
              </select>
              <select class="form-select form-select-sm" id="picker-filter-game" style="width:auto;">
                <option value="">All Games</option>
              </select>
            </div>
            <div class="position-relative">
              <input type="text" class="form-control" id="picker-search"
                     placeholder="Search products…" autocomplete="off">
              <div id="picker-results" class="list-group position-absolute w-100 shadow-sm d-none"
                   style="z-index:1050; max-height:250px; overflow-y:auto; top:100%;"></div>
            </div>
            <div id="picker-selected" class="d-none mt-2 p-2 border rounded bg-light d-flex align-items-center gap-2">
              <img id="picker-selected-img" src="" alt="" style="width:32px;height:32px;object-fit:contain;border-radius:4px;">
              <span id="picker-selected-name" class="fw-medium small"></span>
              <span id="picker-selected-badge" class="badge text-bg-secondary small ms-auto"></span>
              <button type="button" class="btn-close btn-close-sm ms-2" onclick="clearProductSelection()"></button>
            </div>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="item-date">Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="item-date">
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="item-type">Type <span class="text-danger">*</span></label>
            <select class="form-select" id="item-type">
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="item-qty">Quantity <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="item-qty" min="1" placeholder="1">
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="item-price">Unit Price <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" id="item-price" min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="platform">Platform</label>
            <select class="form-select" id="platform" name="platform">
              <option value=""></option>
              <option value="TCGPlayer">TCGPlayer</option>
              <option value="eBay">eBay</option>
              <option value="LGS">LGS</option>
              <option value="Trade">Trade</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-medium" for="notes">Notes</label>
            <input type="text" class="form-control" id="notes" name="notes" placeholder="Notes (optional)">
          </div>
        </div>
        <div id="modal-error" class="alert alert-danger py-2 small mt-3 d-none"></div>
        <div id="batch-indicator" class="alert alert-info py-2 small d-none mt-2">
          <i class="bi bi-stack me-1"></i><span id="batch-count">0</span> queued — will all be saved together
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-outline-primary btn-sm d-none" id="modal-add-another-btn" onclick="addToBatch()">Add to Batch</button>
        <button class="btn btn-primary btn-sm" id="modal-save-btn" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center pt-4">
        <i class="bi bi-trash3 fs-2 text-danger"></i>
        <p class="mt-2 mb-1 fw-medium">Delete this transaction?</p>
      </div>
      <div class="modal-footer border-0 justify-content-center pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>
{{ end }}

{{ define "page-scripts" }}
<script>
  const itemModal   = new bootstrap.Modal(document.getElementById('itemModal'));
  const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
  let products = [];
  let productMap = {};
  let transactionBatch = [];

  document.getElementById('itemModal').addEventListener('hidden.bs.modal', () => { transactionBatch = []; });

  // Show admin controls if signed in
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      document.getElementById('btn-refresh-group').classList.remove('d-none');
    }
  });

  // ── Filterable Product Picker ─────────────────────────────────────────────

  const pickerSearch  = document.getElementById('picker-search');
  const pickerResults = document.getElementById('picker-results');
  const pickerType    = document.getElementById('picker-filter-type');
  const pickerGame    = document.getElementById('picker-filter-game');
  let pickerDebounce  = null;

  function populatePickerFilters(prods) {
    const games = [...new Set(prods.map(p => p.game_category).filter(Boolean))].sort();
    pickerGame.innerHTML = '<option value="">All Games</option>' +
      games.map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');
  }

  function filterProducts(query) {
    const typeFilter = pickerType.value;
    const gameFilter = pickerGame.value;
    const q = query.toLowerCase().trim();
    return products.filter(p => {
      if (typeFilter) {
        const isSealed = p.product_id.startsWith('sealed:');
        if (typeFilter === 'sealed' && !isSealed) return false;
        if (typeFilter === 'card' && isSealed) return false;
      }
      if (gameFilter && p.game_category !== gameFilter) return false;
      if (!q) return true;
      return (p.name && p.name.toLowerCase().includes(q)) ||
             (p.game_category && p.game_category.toLowerCase().includes(q)) ||
             (p.game_subcategory && p.game_subcategory.toLowerCase().includes(q)) ||
             (p.product_category && p.product_category.toLowerCase().includes(q));
    }).slice(0, 50);
  }

  function renderPickerResults(filtered) {
    if (filtered.length === 0) {
      pickerResults.innerHTML = '<div class="list-group-item text-muted small">No matches</div>';
      pickerResults.classList.remove('d-none');
      return;
    }
    pickerResults.innerHTML = filtered.map(p => {
      const isSealed = p.product_id.startsWith('sealed:');
      const badge = isSealed
        ? '<span class="badge text-bg-primary me-1" style="font-size:0.65em">Sealed</span>'
        : '<span class="badge text-bg-info me-1" style="font-size:0.65em">Card</span>';
      const img = p.image_url
        ? `<img src="${escHtml(p.image_url)}" alt="" style="width:28px;height:28px;object-fit:contain;border-radius:3px;flex-shrink:0;">`
        : `<div style="width:28px;height:28px;background:#f0f0f0;border-radius:3px;flex-shrink:0;"></div>`;
      return `<button type="button" class="list-group-item list-group-item-action py-1 px-2 d-flex align-items-center gap-2"
                      onclick="selectProduct('${escHtml(p.product_id)}')">
        ${img} ${badge}
        <span class="small text-truncate">${escHtml(p.name)}</span>
        <span class="text-muted small ms-auto" style="font-size:0.7em;white-space:nowrap;">${escHtml(p.game_category || '')} / ${escHtml(p.game_subcategory || '')}</span>
      </button>`;
    }).join('');
    pickerResults.classList.remove('d-none');
  }

  function updatePickerResults() {
    const q = pickerSearch.value;
    if (!q && !pickerType.value && !pickerGame.value) {
      pickerResults.classList.add('d-none');
      return;
    }
    renderPickerResults(filterProducts(q));
  }

  pickerSearch.addEventListener('input', () => {
    clearTimeout(pickerDebounce);
    pickerDebounce = setTimeout(updatePickerResults, 150);
  });
  pickerSearch.addEventListener('focus', () => {
    if (pickerSearch.value || pickerType.value || pickerGame.value) updatePickerResults();
  });
  pickerType.addEventListener('change', updatePickerResults);
  pickerGame.addEventListener('change', updatePickerResults);

  // Close results when clicking outside
  document.addEventListener('click', e => {
    if (!e.target.closest('#product-picker')) pickerResults.classList.add('d-none');
  });

  function selectProduct(productId) {
    const p = productMap[productId];
    if (!p) return;
    document.getElementById('item-product-id').value = productId;
    pickerSearch.classList.add('d-none');
    pickerType.parentElement.parentElement.querySelector('.d-flex').classList.add('d-none');
    pickerResults.classList.add('d-none');
    const sel = document.getElementById('picker-selected');
    const img = document.getElementById('picker-selected-img');
    const name = document.getElementById('picker-selected-name');
    const badge = document.getElementById('picker-selected-badge');
    if (p.image_url) { img.src = p.image_url; img.classList.remove('d-none'); }
    else { img.classList.add('d-none'); }
    name.textContent = p.name;
    const isSealed = productId.startsWith('sealed:');
    badge.textContent = isSealed ? 'Sealed' : 'Card';
    badge.className = 'badge small ms-auto ' + (isSealed ? 'text-bg-primary' : 'text-bg-info');
    sel.classList.remove('d-none');
    sel.classList.add('d-flex');
  }

  function clearProductSelection() {
    document.getElementById('item-product-id').value = '';
    pickerSearch.value = '';
    pickerSearch.classList.remove('d-none');
    document.querySelector('#product-picker .d-flex').classList.remove('d-none');
    const sel = document.getElementById('picker-selected');
    sel.classList.add('d-none');
    sel.classList.remove('d-flex');
    pickerSearch.focus();
  }

  // ── Load data ─────────────────────────────────────────────────────────────

  (async () => {
    products = await loadJsonData('products.json').catch(() => []);
    productMap = Object.fromEntries(products.map(p => [p.product_id, p]));
    populatePickerFilters(products);

    // Check URL param for pre-selected product
    const params = new URLSearchParams(window.location.search);
    const preselect = params.get('product_id');
    if (preselect && productMap[preselect]) {
      // Auto-open modal with product pre-selected
      setTimeout(() => {
        openCreateModal();
        selectProduct(preselect);
        itemModal.show();
      }, 300);
    }

    await loadItems();
  })();

  function productCell(id) {
    const p = productMap[id];
    const name = p ? p.name : id;
    const img = p && p.image_url
      ? `<img src="${escHtml(p.image_url)}" alt="" style="width:36px;height:36px;object-fit:contain;border-radius:4px;flex-shrink:0;">`
      : `<div style="width:36px;height:36px;background:#f0f0f0;border-radius:4px;flex-shrink:0;"></div>`;
    return `<div class="d-flex align-items-center gap-2">${img}<span>${escHtml(name)}</span></div>`;
  }

  async function refreshItems(source) {
    const btns = document.querySelectorAll('#btn-refresh-group button');
    btns.forEach(b => b.disabled = true);
    await loadItems(source);
    btns.forEach(b => b.disabled = false);
  }

  async function loadItems(source = 'github') {
    try {
      let items;
      if (source === 'api') {
        items = await api('GET', '/transactions');
      } else if (source === 'gcs') {
        items = await loadFromGCS('transactions.json');
      } else {
        items = await loadJsonData('transactions.json');
      }
      document.getElementById('loading').classList.add('d-none');
      if (!items || items.length === 0) {
        document.getElementById('empty-state').classList.remove('d-none');
        return;
      }
      renderItems(items);
    } catch (e) {
      document.getElementById('loading').classList.add('d-none');
      showToast('Failed to load transactions: ' + e.message, 'danger');
    }
  }

  function renderItems(items) {
    document.getElementById('items-card').classList.remove('d-none');
    document.getElementById('empty-state').classList.add('d-none');
    document.getElementById('items-tbody').innerHTML = items.map(t => `
      <tr>
        <td class="ps-3 fw-medium">${productCell(t.product_id)}</td>
        <td class="text-muted">${fmtDate(t.transaction_date)}</td>
        <td>
          <span class="badge ${t.transaction_type === 'buy' ? 'text-bg-success' : 'text-bg-warning'}">
            ${escHtml(t.transaction_type)}
          </span>
        </td>
        <td>${t.quantity}</td>
        <td>$${Number(t.unit_price).toFixed(2)}</td>
        <td class="text-end pe-3">
          <button class="btn btn-sm btn-outline-secondary me-1" onclick='openEditModal(${JSON.stringify(t)})'>
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal('${t.transaction_id}')">
            <i class="bi bi-trash3"></i>
          </button>
        </td>
      </tr>
    `).join('');
  }

  function resetTransactionForm(full = true) {
    document.getElementById('item-id').value = '';
    if (full) {
      clearProductSelection();
      document.getElementById('item-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('item-type').value = 'buy';
      document.getElementById('platform').value = '';
    }
    document.getElementById('item-qty').value = '';
    document.getElementById('item-price').value = '';
    document.getElementById('notes').value = '';
    document.getElementById('modal-error').classList.add('d-none');
  }

  function updateBatchIndicator() {
    const n = transactionBatch.length;
    const indicator = document.getElementById('batch-indicator');
    const saveBtn = document.getElementById('modal-save-btn');
    if (n > 0) {
      document.getElementById('batch-count').textContent = n;
      indicator.classList.remove('d-none');
      saveBtn.textContent = `Save All (${n + 1})`;
    } else {
      indicator.classList.add('d-none');
      saveBtn.textContent = 'Save';
    }
  }

  function buildTransactionBody() {
    return {
      product_id: document.getElementById('item-product-id').value,
      transaction_date: document.getElementById('item-date').value,
      transaction_type: document.getElementById('item-type').value,
      quantity: parseInt(document.getElementById('item-qty').value),
      unit_price: parseFloat(document.getElementById('item-price').value),
      platform: document.getElementById('platform').value,
      notes: document.getElementById('notes').value,
    };
  }

  function openCreateModal() {
    document.getElementById('modal-title').textContent = 'Log Transaction';
    transactionBatch = [];
    resetTransactionForm(true);
    updateBatchIndicator();
    document.getElementById('modal-add-another-btn').classList.remove('d-none');
  }

  function openEditModal(t) {
    document.getElementById('modal-title').textContent = 'Edit Transaction';
    transactionBatch = [];
    document.getElementById('modal-add-another-btn').classList.add('d-none');
    document.getElementById('item-id').value = t.transaction_id;
    selectProduct(t.product_id);
    document.getElementById('item-date').value = t.transaction_date ? t.transaction_date.split('T')[0] : '';
    document.getElementById('item-type').value = t.transaction_type;
    document.getElementById('item-qty').value = t.quantity;
    document.getElementById('item-price').value = t.unit_price;
    document.getElementById('platform').value = t.platform || '';
    document.getElementById('notes').value = t.notes || '';
    document.getElementById('modal-error').classList.add('d-none');
    itemModal.show();
  }

  function addToBatch() {
    const product = document.getElementById('item-product-id').value;
    const date    = document.getElementById('item-date').value;
    const qty     = parseInt(document.getElementById('item-qty').value);
    const price   = parseFloat(document.getElementById('item-price').value);
    const errEl   = document.getElementById('modal-error');
    errEl.classList.add('d-none');
    if (!product || !date || isNaN(qty) || isNaN(price)) {
      errEl.textContent = 'All fields are required.';
      errEl.classList.remove('d-none');
      return;
    }
    transactionBatch.push(buildTransactionBody());
    resetTransactionForm(false); // keep product, date, type, platform
    updateBatchIndicator();
    document.getElementById('item-qty').focus();
  }

  async function saveItem() {
    const id      = document.getElementById('item-id').value;
    const product = document.getElementById('item-product-id').value;
    const date    = document.getElementById('item-date').value;
    const qty     = parseInt(document.getElementById('item-qty').value);
    const price   = parseFloat(document.getElementById('item-price').value);
    const errEl   = document.getElementById('modal-error');
    errEl.classList.add('d-none');

    if (!product || !date || isNaN(qty) || isNaN(price)) {
      errEl.textContent = 'All fields are required.';
      errEl.classList.remove('d-none');
      return;
    }

    const btn = document.getElementById('modal-save-btn');
    const anotherBtn = document.getElementById('modal-add-another-btn');
    btn.disabled = true;
    anotherBtn.disabled = true;
    try {
      if (id) {
        await api('PUT', `/transactions/${id}`, buildTransactionBody());
      } else {
        const all = [...transactionBatch, buildTransactionBody()];
        if (all.length === 1) {
          await api('POST', '/transactions', all[0]);
        } else {
          await api('POST', '/transactions/bulk', { transactions: all });
        }
      }
      itemModal.hide();
      await loadItems();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      anotherBtn.disabled = false;
    }
  }

  let pendingDeleteId = null;
  function openDeleteModal(id) { pendingDeleteId = id; deleteModal.show(); }

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    try {
      await api('DELETE', `/transactions/${pendingDeleteId}`);
      deleteModal.hide();
      await loadItems();
    } catch (e) { showToast('Delete failed: ' + e.message, 'danger'); }
  });

  function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
  function fmtDate(s) { return s ? new Date(s).toLocaleDateString() : '—'; }
</script>
{{ end }}
