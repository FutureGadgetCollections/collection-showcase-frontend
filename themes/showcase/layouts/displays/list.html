{{ define "main" }}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="h5 mb-0 fw-semibold"><i class="bi bi-shop-window me-2 text-primary"></i>Displays</h2>
  <div class="d-flex gap-2">
    <button id="btn-add-display" class="btn btn-primary btn-sm d-none" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="openCreateModal()">
      <i class="bi bi-plus-lg me-1"></i>Add Display
    </button>
  </div>
</div>

<div id="loading" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
<div id="empty-state" class="text-center py-5 d-none">
  <i class="bi bi-shop-window fs-1 text-muted"></i>
  <p class="text-muted mt-2">No displays yet.</p>
</div>

<div id="items-grid" class="row g-3 d-none"></div>

<!-- Create Modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Add Display</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small fw-medium" for="item-name">Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="item-name" placeholder="e.g. Main Shelf">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium" for="item-type">Type <span class="text-danger">*</span></label>
          <select class="form-select" id="item-type">
            <option value="bookshelf">Bookshelf</option>
            <option value="bin">Bin</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium" for="item-description">Description</label>
          <textarea class="form-control" id="item-description" rows="2" placeholder="Optional description"></textarea>
        </div>
        <div id="modal-error" class="alert alert-danger py-2 small d-none"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary btn-sm" id="modal-save-btn" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center pt-4">
        <i class="bi bi-trash3 fs-2 text-danger"></i>
        <p class="mt-2 mb-1 fw-medium">Delete this display?</p>
        <p class="text-muted small">All items in this display will be removed.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>
{{ end }}

{{ define "page-scripts" }}
<script>
  const itemModal   = new bootstrap.Modal(document.getElementById('itemModal'));
  const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

  loadItems();

  firebase.auth().onAuthStateChanged(user => {
    if (user && isEmailAllowed(user.email)) {
      document.getElementById('btn-add-display').classList.remove('d-none');
    }
  });

  async function loadItems() {
    try {
      const items = await loadJsonData('displays/index.json');
      document.getElementById('loading').classList.add('d-none');
      if (!items || items.length === 0) {
        document.getElementById('empty-state').classList.remove('d-none');
        return;
      }
      renderItems(items);
    } catch (e) {
      document.getElementById('loading').classList.add('d-none');
      showToast('Failed to load displays: ' + e.message, 'danger');
    }
  }

  function typeIcon(t) {
    return t === 'bin' ? 'bi-archive' : 'bi-bookshelf';
  }

  function typeBadge(t) {
    const cls = t === 'bin' ? 'bg-secondary' : 'bg-primary';
    return `<span class="badge ${cls} text-capitalize">${escHtml(t || 'bookshelf')}</span>`;
  }

  function renderItems(items) {
    const grid = document.getElementById('items-grid');
    grid.classList.remove('d-none');
    document.getElementById('empty-state').classList.add('d-none');
    grid.innerHTML = items.map(d => `
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body d-flex flex-column">
            <div class="d-flex align-items-start justify-content-between mb-2">
              <h6 class="card-title mb-0 fw-semibold">
                <i class="bi ${typeIcon(d.display_type)} text-primary me-1"></i>${escHtml(d.name)}
              </h6>
              <span id="admin-btns-${escHtml(d.display_id)}" class="d-none ms-2 flex-shrink-0">
                <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal('${escHtml(d.display_id)}')" title="Delete">
                  <i class="bi bi-trash3"></i>
                </button>
              </span>
            </div>
            <div class="mb-3">${typeBadge(d.display_type)}</div>
            <div class="mt-auto">
              <a href="{{ "" | relURL }}displays/view/?id=${escHtml(d.display_id)}" class="btn btn-sm btn-outline-primary w-100">
                <i class="bi bi-eye me-1"></i>View Display
              </a>
            </div>
          </div>
        </div>
      </div>
    `).join('');

    firebase.auth().onAuthStateChanged(user => {
      if (user && isEmailAllowed(user.email)) {
        items.forEach(d => {
          const el = document.getElementById('admin-btns-' + d.display_id);
          if (el) el.classList.remove('d-none');
        });
      }
    });
  }

  function openCreateModal() {
    document.getElementById('item-name').value = '';
    document.getElementById('item-type').value = 'bookshelf';
    document.getElementById('item-description').value = '';
    document.getElementById('modal-error').classList.add('d-none');
  }

  async function saveItem() {
    const name = document.getElementById('item-name').value.trim();
    const errEl = document.getElementById('modal-error');
    errEl.classList.add('d-none');
    if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.remove('d-none'); return; }

    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    try {
      await api('POST', '/displays', {
        name,
        display_type: document.getElementById('item-type').value,
        description: document.getElementById('item-description').value.trim(),
      });
      itemModal.hide();
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('items-grid').classList.add('d-none');
      await loadItems();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove('d-none');
    } finally {
      btn.disabled = false;
    }
  }

  let pendingDeleteId = null;
  function openDeleteModal(id) { pendingDeleteId = id; deleteModal.show(); }

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    try {
      await api('DELETE', `/displays/${pendingDeleteId}`);
      deleteModal.hide();
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('items-grid').classList.add('d-none');
      await loadItems();
    } catch (e) { showToast('Delete failed: ' + e.message, 'danger'); }
  });

  function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
</script>
{{ end }}
