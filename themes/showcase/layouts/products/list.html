{{ define "main" }}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="h5 mb-0 fw-semibold"><i class="bi bi-box me-2 text-primary"></i>Products</h2>
</div>

<!-- Step 1: Sealed vs Singles -->
<div id="step-type" class="mb-4">
  <h6 class="text-muted small fw-semibold text-uppercase mb-3">Choose product type</h6>
  <div class="row g-3">
    <div class="col-sm-6">
      <button class="btn btn-outline-primary w-100 py-3 text-start" onclick="pickType('sealed')">
        <i class="bi bi-box-seam fs-4 me-2 align-middle"></i>
        <span class="fw-semibold">Sealed Products</span>
        <div class="text-muted small mt-1">Booster boxes, ETBs, display boxes, etc.</div>
      </button>
    </div>
    <div class="col-sm-6">
      <button class="btn btn-outline-info w-100 py-3 text-start" onclick="pickType('card')">
        <i class="bi bi-collection fs-4 me-2 align-middle"></i>
        <span class="fw-semibold">Single Cards</span>
        <div class="text-muted small mt-1">Individual cards by set</div>
      </button>
    </div>
  </div>
</div>

<!-- Step 2: Game -->
<div id="step-game" class="mb-4 d-none">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="#" onclick="resetToType(); return false;">Type</a></li>
      <li class="breadcrumb-item active" id="bc-type"></li>
    </ol>
  </nav>
  <h6 class="text-muted small fw-semibold text-uppercase mb-3">Choose game</h6>
  <div class="row g-3" id="game-cards"></div>
</div>

<!-- Step 3: Set -->
<div id="step-set" class="mb-4 d-none">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="#" onclick="resetToType(); return false;">Type</a></li>
      <li class="breadcrumb-item"><a href="#" onclick="resetToGame(); return false;" id="bc-type2"></a></li>
      <li class="breadcrumb-item active" id="bc-game"></li>
    </ol>
  </nav>
  <h6 class="text-muted small fw-semibold text-uppercase mb-3">Choose set</h6>
  <div id="set-list"></div>
</div>

<!-- Step 4: Results -->
<div id="step-results" class="d-none">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small mb-0">
      <li class="breadcrumb-item"><a href="#" onclick="resetToType(); return false;">Type</a></li>
      <li class="breadcrumb-item"><a href="#" onclick="resetToGame(); return false;" id="bc-type3"></a></li>
      <li class="breadcrumb-item"><a href="#" onclick="resetToSet(); return false;" id="bc-game2"></a></li>
      <li class="breadcrumb-item active" id="bc-set"></li>
    </ol>
  </nav>
  <div id="results-loading" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</div>
  <div id="results-count" class="text-muted small mb-2 d-none"></div>
  <div class="card shadow-sm border-0 d-none" id="items-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">Product</th>
              <th>Type</th>
              <th class="text-end pe-3">Actions</th>
            </tr>
          </thead>
          <tbody id="items-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="results-empty" class="text-center text-muted py-4 d-none">No products found for this set.</div>
</div>
{{ end }}

  let currentType = null;
  let currentGame = null;
  let currentSet  = null;

  function showStep(step) {
    ['step-type','step-game','step-set','step-results'].forEach(id =>
      document.getElementById(id).classList.add('d-none'));
    document.getElementById(step).classList.remove('d-none');
  }

  function resetToType() { currentType = currentGame = currentSet = null; showStep('step-type'); }

  function resetToGame() {
    currentGame = currentSet = null;
    pickType(currentType);
  }

  function resetToSet() {
    currentSet = null;
    pickGame(currentGame);
  }

  // ── Step 1 → 2 ────────────────────────────────────────────────────────────

  function pickType(type) {
    currentType = type;
    const typeLabel = type === 'sealed' ? 'Sealed' : 'Singles';
    document.getElementById('bc-type').textContent = typeLabel;

    const container = document.getElementById('game-cards');
    container.innerHTML = Object.entries(CATALOG).map(([key, g]) => `
      <div class="col-sm-4 col-md-3">
        <button class="btn btn-outline-secondary w-100 py-3" onclick="pickGame('${key}')">
          <i class="${g.icon} fs-4 d-block mb-1"></i>
          <span class="fw-medium">${escHtml(g.label)}</span>
        </button>
      </div>
    `).join('');
    showStep('step-game');
  }

  // ── Step 2 → 3 ────────────────────────────────────────────────────────────

  function pickGame(game) {
    currentGame = game;
    const g = CATALOG[game];
    const typeLabel = currentType === 'sealed' ? 'Sealed' : 'Singles';
    document.getElementById('bc-type2').textContent = typeLabel;
    document.getElementById('bc-game').textContent = g.label;

    const container = document.getElementById('set-list');
    let html = '';
    for (const [era, sets] of Object.entries(g.eras)) {
      html += `<h6 class="fw-semibold mt-3 mb-2">${escHtml(era)}</h6>`;
      html += '<div class="list-group mb-2">';
      for (const s of sets) {
        html += `<button class="list-group-item list-group-item-action py-2 d-flex justify-content-between align-items-center"
                         onclick="pickSet('${escHtml(s.code)}','${escHtml(s.label)}')">
          <span>${escHtml(s.label)}</span>
          <span class="text-muted small">${escHtml(s.code)}</span>
        </button>`;
      }
      html += '</div>';
    }
    container.innerHTML = html;
    showStep('step-set');
  }

  // ── Step 3 → 4: Load products ──────────────────────────────────────────────

  async function pickSet(setCode, setLabel) {
    currentSet = setCode;
    const g = CATALOG[currentGame];
    const typeLabel = currentType === 'sealed' ? 'Sealed' : 'Singles';
    document.getElementById('bc-type3').textContent = typeLabel;
    document.getElementById('bc-game2').textContent = g.label;
    document.getElementById('bc-set').textContent = setLabel;
    showStep('step-results');

    document.getElementById('results-loading').classList.remove('d-none');
    document.getElementById('items-card').classList.add('d-none');
    document.getElementById('results-empty').classList.add('d-none');
    document.getElementById('results-count').classList.add('d-none');

    try {
      const items = await api('GET', `/products?type=${currentType}&game=${currentGame}&set_code=${setCode}&limit=500`);
      document.getElementById('results-loading').classList.add('d-none');

      if (!items || items.length === 0) {
        document.getElementById('results-empty').classList.remove('d-none');
        return;
      }
      const countEl = document.getElementById('results-count');
      countEl.textContent = `${items.length} product${items.length === 1 ? '' : 's'}`;
      countEl.classList.remove('d-none');
      renderItems(items);
    } catch (e) {
      document.getElementById('results-loading').classList.add('d-none');
      showToast('Failed to load products: ' + e.message, 'danger');
    }
  }

  function renderItems(items) {
    document.getElementById('items-card').classList.remove('d-none');
    document.getElementById('items-tbody').innerHTML = items.map(p => {
      const isSealed = p.product_id.startsWith('sealed:');
      return `
      <tr>
        <td class="ps-3">
          <div class="d-flex align-items-center gap-2">
            ${p.image_url
              ? `<img src="${escHtml(p.image_url)}" alt="" style="width:40px;height:40px;object-fit:contain;border-radius:4px;">`
              : `<div style="width:40px;height:40px;background:#f0f0f0;border-radius:4px;flex-shrink:0;"></div>`}
            <span class="fw-medium">${escHtml(p.name)}</span>
          </div>
        </td>
        <td class="text-muted">${escHtml(p.product_subtype || p.product_category || '—')}</td>
        <td class="text-end pe-3">
          <a href="/transactions/?product_id=${encodeURIComponent(p.product_id)}"
             class="btn btn-sm btn-outline-primary" title="Log transaction">
            <i class="bi bi-plus-lg me-1"></i>Transaction
          </a>
        </td>
      </tr>`;
    }).join('');
  }

  function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
</script>
