{{ define "main" }}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="h5 mb-0 fw-semibold"><i class="bi bi-box me-2 text-primary"></i>Products</h2>
  <div class="d-flex gap-2">
    <div id="btn-refresh-group" class="btn-group btn-group-sm d-none" role="group" aria-label="Refresh source">
      <button class="btn btn-outline-secondary" onclick="refreshItems('github')">
        <i class="bi bi-github me-1"></i>GitHub
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshItems('gcs')">
        <i class="bi bi-cloud me-1"></i>GCS
      </button>
      <button class="btn btn-outline-primary" onclick="refreshItems('api')">
        <i class="bi bi-plug me-1"></i>API
      </button>
    </div>
  </div>
</div>

<div id="loading" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
<div id="empty-state" class="text-center py-5 d-none">
  <i class="bi bi-inbox fs-1 text-muted"></i>
  <p class="text-muted mt-2">No products found.</p>
</div>

<!-- Filters -->
<div class="card shadow-sm border-0 d-none mb-3" id="filters-card">
  <div class="card-body py-2">
    <div class="row g-2">
      <div class="col-sm-3">
        <select class="form-select form-select-sm" id="filter-type" onchange="applyFilters()">
          <option value="">All Types</option>
          <option value="sealed">Sealed</option>
          <option value="card">Singles</option>
        </select>
      </div>
      <div class="col-sm-3">
        <select class="form-select form-select-sm" id="filter-game" onchange="applyFilters()">
          <option value="">All Games</option>
        </select>
      </div>
      <div class="col-sm-3">
        <select class="form-select form-select-sm" id="filter-subcategory" onchange="applyFilters()">
          <option value="">All Sets</option>
        </select>
      </div>
      <div class="col-sm-3">
        <input type="text" class="form-control form-control-sm" id="filter-search"
               placeholder="Search by name…" oninput="applyFilters()">
      </div>
    </div>
  </div>
</div>

<div id="results-count" class="text-muted small mb-2 d-none"></div>

<div class="card shadow-sm border-0 d-none" id="items-card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">Product</th>
            <th>Game</th>
            <th>Set</th>
            <th>Type</th>
            <th class="text-end pe-3">Actions</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{{ end }}

{{ define "page-scripts" }}
<script>
  // Show admin controls if signed in as admin
  firebase.auth().onAuthStateChanged(user => {
    if (user && isEmailAllowed(user.email)) {
      document.getElementById('btn-refresh-group').classList.remove('d-none');
    }
  });

  let allItems = [];

  // Load data publicly — no auth required
  loadItems();

  async function refreshItems(source) {
    const btns = document.querySelectorAll('#btn-refresh-group button');
    btns.forEach(b => b.disabled = true);
    await loadItems(source);
    btns.forEach(b => b.disabled = false);
  }

  async function loadItems(source = 'github') {
    try {
      let items;
      if (source === 'api') {
        items = await api('GET', '/products');
      } else if (source === 'gcs') {
        items = await loadFromGCS('products.json');
      } else {
        items = await loadJsonData('products.json');
      }
      document.getElementById('loading').classList.add('d-none');
      if (!items || items.length === 0) {
        document.getElementById('empty-state').classList.remove('d-none');
        return;
      }
      allItems = items;
      populateFilters(items);
      applyFilters();
    } catch (e) {
      document.getElementById('loading').classList.add('d-none');
      showToast('Failed to load products: ' + e.message, 'danger');
    }
  }

  function populateFilters(items) {
    const games = [...new Set(items.map(p => p.game_category).filter(Boolean))].sort();
    const sets  = [...new Set(items.map(p => p.game_subcategory).filter(Boolean))].sort();
    const fill = (id, opts) => {
      const sel = document.getElementById(id);
      const first = sel.options[0].outerHTML;
      sel.innerHTML = first + opts.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
    };
    fill('filter-game', games);
    fill('filter-subcategory', sets);
    document.getElementById('filters-card').classList.remove('d-none');
  }

  function applyFilters() {
    const typeVal = document.getElementById('filter-type').value;
    const game    = document.getElementById('filter-game').value;
    const sub     = document.getElementById('filter-subcategory').value;
    const search  = document.getElementById('filter-search').value.toLowerCase().trim();
    const filtered = allItems.filter(p => {
      if (typeVal) {
        const isSealed = p.product_id.startsWith('sealed:');
        if (typeVal === 'sealed' && !isSealed) return false;
        if (typeVal === 'card' && isSealed) return false;
      }
      if (game && p.game_category !== game) return false;
      if (sub && p.game_subcategory !== sub) return false;
      if (search && !(p.name || '').toLowerCase().includes(search)) return false;
      return true;
    });
    const countEl = document.getElementById('results-count');
    countEl.textContent = `Showing ${filtered.length} of ${allItems.length} products`;
    countEl.classList.remove('d-none');
    renderItems(filtered);
  }

  function renderItems(items) {
    document.getElementById('items-card').classList.remove('d-none');
    document.getElementById('empty-state').classList.add('d-none');
    document.getElementById('items-tbody').innerHTML = items.map(p => {
      const isSealed = p.product_id.startsWith('sealed:');
      const typeBadge = isSealed
        ? '<span class="badge text-bg-primary" style="font-size:0.7em">Sealed</span>'
        : '<span class="badge text-bg-info" style="font-size:0.7em">Card</span>';
      return `
      <tr>
        <td class="ps-3">
          <div class="d-flex align-items-center gap-2">
            ${p.image_url
              ? `<img src="${escHtml(p.image_url)}" alt="" style="width:40px;height:40px;object-fit:contain;border-radius:4px;">`
              : `<div style="width:40px;height:40px;background:#f0f0f0;border-radius:4px;flex-shrink:0;"></div>`}
            <div>
              <span class="fw-medium">${escHtml(p.name)}</span>
              <div>${typeBadge}</div>
            </div>
          </div>
        </td>
        <td class="text-muted">${escHtml(p.game_category || '—')}</td>
        <td class="text-muted">${escHtml(p.game_subcategory || '—')}</td>
        <td class="text-muted">${escHtml(p.product_category || '—')}</td>
        <td class="text-end pe-3">
          <a href="/transactions/?product_id=${encodeURIComponent(p.product_id)}"
             class="btn btn-sm btn-outline-primary" title="Log transaction for this product">
            <i class="bi bi-plus-lg me-1"></i>Transaction
          </a>
        </td>
      </tr>`;
    }).join('');
  }

  function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
</script>
{{ end }}
